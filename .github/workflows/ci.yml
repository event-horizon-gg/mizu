name: Mizu CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build Swift package
        run: swift build
      - name: Build iPhone showcase
        run: >-
          xcodebuild -project Examples/MizuShowcase.xcodeproj -scheme MizuShowcase
          -configuration Release -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
      - name: Exercise showcase controls
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcodebuild -project Examples/MizuShowcase.xcodeproj -scheme MizuShowcase -configuration Debug -destination "platform=iOS Simulator,id=$simulator_id" -resultBundlePath "$RUNNER_TEMP/MizuTests.xcresult" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mizu-ui-test-results
          path: ${{ runner.temp }}/MizuTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
